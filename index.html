<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estoque · DigiPower</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icone_digipower_512.png">
<link rel="apple-touch-icon" href="icone_digipower_512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E0E0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Estoque DigiPower">
<meta name="robots" content="noindex, nofollow">
<!--
  ESTOQUE DIGIPOWER · PÁGINA DE ABERTURA V1.4 (GitHub Pages)   Decisão Consultoria
  V1.4: quando sai versão nova do aplicativo, o app pede e esta página recarrega sozinha.
  V1.3: o aviso do Windows serve também à fila de impressão; o clique abre a tela certa.
  V1.2: aviso do Windows de nova requisição de compra. O app pede, esta página
  mostra (dentro do quadro do Google o Chrome não deixa pedir permissão).
  V1.1: faz a ponte com a Zebra. Dentro do quadro do Google o Chrome não deixa o
  app falar com o Zebra Browser Print (rede local); esta página, que é a de
  cima, faz a chamada e devolve a resposta. Só aceita endereços do Browser
  Print neste computador (127.0.0.1 / localhost, portas 9100 e 9101).
  Abre o aplicativo do Apps Script em tela cheia, sem a faixa do Google, e
  permite instalar o app (ícone na tela inicial do celular e na área de
  trabalho do PC). Não guarda nenhum dado do sistema.
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#0E0E0F;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#F2F2F0}
  .espera{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:#0E0E0F;color:#B5B5B5;
    font:500 14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;z-index:2;transition:opacity .4s}
  .espera img.logo{width:240px;max-width:70vw;height:auto}
  .espera .giro{width:22px;height:22px;border:3px solid #2A2A2C;border-top-color:#D7141A;
    border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .espera a{color:#FF4A4F;font-weight:700}
  .some{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <div class="espera" id="espera">
    <img class="logo" src="logo_digipower_negativo.png" alt="DigiPower — Potência com Segurança" onerror="this.src='icone_digipower_512.png';this.style.width='76px'">
    <div class="giro"></div>
    <div>Abrindo o Estoque DigiPower…</div>
  </div>

  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbzXEKfXO1RTzdLKAMSIsHZehj3RWUDP0Kk8jfTRMrg5hEjL5pe5N2RXcVTt3wS-xIz5Nw/exec"
          allow="camera; clipboard-write; fullscreen; local-network-access"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  /* O app avisa quantos pedidos estão na fila de impressão; só esta página
     pode pôr o número sobre o ícone do app instalado. */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.tipo !== 'badge') { return; }
    try {
      if (navigator.setAppBadge) { if (d.n > 0) { navigator.setAppBadge(d.n); } else { navigator.clearAppBadge(); } }
      document.title = (d.n > 0 ? '(' + d.n + ') ' : '') + 'Estoque · DigiPower';
    } catch (e) { /* navegador sem suporte */ }
  });

  /* Ponte com o Zebra Browser Print */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.tipo || !ev.source) { return; }
    if (!/(^https:\/\/[\w.-]+\.googleusercontent\.com$)|(^https:\/\/script\.google\.com$)/.test(ev.origin)) { return; }
    if (d.tipo === 'ponte_ping') { ev.source.postMessage({ tipo: 'ponte_ok', versao: '1.4' }, '*'); return; }
    if (d.tipo !== 'zebra_req') { return; }
    var responder = function (r) { r.tipo = 'zebra_resp'; r.id = d.id; ev.source.postMessage(r, '*'); };
    if (!/^https?:\/\/(127\.0\.0\.1|localhost):910[01]\//.test(String(d.url))) { responder({ ok: null, erro: 'endereço não permitido' }); return; }
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) { ctl.abort(); } }, d.ms || 4000);
    var op = { method: d.metodo || 'GET' };
    if (ctl) { op.signal = ctl.signal; }
    if (d.corpo) { op.body = d.corpo; op.headers = { 'Content-Type': 'text/plain;charset=UTF-8' }; }
    fetch(d.url, op).then(function (r) {
      return r.text().then(function (tx) { clearTimeout(t); responder({ ok: r.ok, status: r.status, texto: tx }); });
    }).catch(function (e) { clearTimeout(t); responder({ ok: null, erro: String((e && e.message) || e) }); });
  });

  /* V1.2 · Aviso do Windows (notificação) pedido pelo app */
  var _app = null;
  var respNotif = function (alvo, pedido) {
    try { alvo.postMessage({ tipo: 'notif_resp', permissao: ('Notification' in window) ? Notification.permission : 'sem_suporte', pedido: !!pedido }, '*'); } catch (e) { /* nada */ }
  };
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.tipo || !ev.source) { return; }
    if (!/(^https:\/\/[\w.-]+\.googleusercontent\.com$)|(^https:\/\/script\.google\.com$)/.test(ev.origin)) { return; }
    if (d.tipo === 'recarregar') { setTimeout(function () { location.reload(); }, 150); return; }
    if (d.tipo !== 'notif_estado' && d.tipo !== 'notif_pedir' && d.tipo !== 'notificar') { return; }
    _app = ev.source;
    if (!('Notification' in window)) { respNotif(ev.source); return; }
    if (d.tipo === 'notif_estado') { respNotif(ev.source); return; }
    if (d.tipo === 'notif_pedir') {
      var p = Notification.requestPermission(function () { respNotif(ev.source, true); });
      if (p && p.then) { p.then(function () { respNotif(ev.source, true); }); }
      return;
    }
    if (Notification.permission !== 'granted') { return; }
    var tela = d.tela === 'fila' ? 'fila' : 'req';
    try {
      var n = new Notification(String(d.titulo || 'Estoque DigiPower').substring(0, 120), {
        body: String(d.corpo || '').substring(0, 300), icon: 'icone_digipower_512.png', badge: 'icone_digipower_512.png',
        tag: String(d.tag || ''), requireInteraction: !!d.urgente });
      n.onclick = function () { try { window.focus(); if (_app) { _app.postMessage({ tipo: 'abrir_tela', tela: tela }, '*'); } } catch (e) { /* nada */ } n.close(); };
    } catch (e) { /* navegador sem suporte */ }
  });

  /* Service worker: é o que faz o Chrome oferecer "Instalar aplicativo". */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('service worker não registrado:', e); });
    });
  }

  var quadro = document.getElementById('app');
  var espera = document.getElementById('espera');
  quadro.addEventListener('load', function () {
    espera.classList.add('some');
    setTimeout(function () { espera.style.display = 'none'; }, 500);
  });

  /* Rede lenta: em 20 segundos ainda sem abrir, oferece o caminho direto. */
  setTimeout(function () {
    if (espera.style.display !== 'none') {
      espera.innerHTML = '<div style="max-width:420px;text-align:center;padding:24px;color:#D0D0D0">'
        + 'Está demorando mais que o normal. Confira o Wi-Fi.<br><br>'
        + '<a href="' + quadro.getAttribute('src') + '">Abrir direto</a></div>';
    }
  }, 20000);
</script>
</body>
</html>
