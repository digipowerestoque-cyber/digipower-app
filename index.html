<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estoque · DigiPower</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icone_digipower_512.png">
<link rel="apple-touch-icon" href="icone_digipower_512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E0E0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Estoque DigiPower">
<meta name="robots" content="noindex, nofollow">
<!--
  ESTOQUE DIGIPOWER · PÁGINA DE ABERTURA V1.0 (GitHub Pages)   Decisão Consultoria
  Abre o aplicativo do Apps Script em tela cheia, sem a faixa do Google, e
  permite instalar o app (ícone na tela inicial do celular e na área de
  trabalho do PC). Não guarda nenhum dado do sistema.
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#0E0E0F;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#F2F2F0}
  .espera{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:#0E0E0F;color:#B5B5B5;
    font:500 14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;z-index:2;transition:opacity .4s}
  .espera img.logo{width:240px;max-width:70vw;height:auto}
  .espera .giro{width:22px;height:22px;border:3px solid #2A2A2C;border-top-color:#D7141A;
    border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .espera a{color:#FF4A4F;font-weight:700}
  .some{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <div class="espera" id="espera">
    <img class="logo" src="logo_digipower_negativo.png" alt="DigiPower — Potência com Segurança" onerror="this.src='icone_digipower_512.png';this.style.width='76px'">
    <div class="giro"></div>
    <div>Abrindo o Estoque DigiPower…</div>
  </div>

  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbzXEKfXO1RTzdLKAMSIsHZehj3RWUDP0Kk8jfTRMrg5hEjL5pe5N2RXcVTt3wS-xIz5Nw/exec"
          allow="camera; clipboard-write; fullscreen; local-network-access"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  /* O app avisa quantos pedidos estão na fila de impressão; só esta página
     pode pôr o número sobre o ícone do app instalado. */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.tipo !== 'badge') { return; }
    try {
      if (navigator.setAppBadge) { if (d.n > 0) { navigator.setAppBadge(d.n); } else { navigator.clearAppBadge(); } }
      document.title = (d.n > 0 ? '(' + d.n + ') ' : '') + 'Estoque · DigiPower';
    } catch (e) { /* navegador sem suporte */ }
  });

  /* Service worker: é o que faz o Chrome oferecer "Instalar aplicativo". */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('service worker não registrado:', e); });
    });
  }

  var quadro = document.getElementById('app');
  var espera = document.getElementById('espera');
  quadro.addEventListener('load', function () {
    espera.classList.add('some');
    setTimeout(function () { espera.style.display = 'none'; }, 500);
  });

  /* Rede lenta: em 20 segundos ainda sem abrir, oferece o caminho direto. */
  setTimeout(function () {
    if (espera.style.display !== 'none') {
      espera.innerHTML = '<div style="max-width:420px;text-align:center;padding:24px;color:#D0D0D0">'
        + 'Está demorando mais que o normal. Confira o Wi-Fi.<br><br>'
        + '<a href="' + quadro.getAttribute('src') + '">Abrir direto</a></div>';
    }
  }, 20000);
</script>
</body>
</html>
